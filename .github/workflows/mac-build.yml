name: Build Mac app

# Builds a universal (Apple Silicon + Intel) Todojam.dmg and publishes it, plus the
# signed update files the app's built-in updater reads, to the `latest-mac` release.
# Runs on every push to main and on demand from the Actions tab. Each build gets
# version 0.1.<run number>, so installed apps see it as newer and offer "Update now".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the build job gets write access (to publish the release); the repo token is
# handed only to the steps that publish, not to npm install or the tests.
permissions:
  contents: read

concurrency:
  group: mac-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      # Third-party actions are pinned to exact commits so a hijacked tag can't swap in
      # code that sees the signing key.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      - name: Stamp this build's version
        run: node -e 'const f="src-tauri/tauri.conf.json",fs=require("fs"),c=JSON.parse(fs.readFileSync(f));c.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(c,null,2))'

      - name: Remove the previous build's files from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest-mac --json assets --jq '.assets[].name' 2>/dev/null \
            | grep -v '^Todojam.dmg$' \
            | while read -r name; do gh release delete-asset latest-mac "$name" -y; done || true

      - name: Build and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --target universal-apple-darwin
          tagName: latest-mac
          releaseName: Todojam for Mac
          releaseBody: |
            Download **Todojam.dmg** below, open it, and drag Todojam into Applications.
            First launch: macOS will say it can't verify the developer. Open System Settings > Privacy & Security, scroll down, and click **Open Anyway**.
            After that, Todojam offers new versions itself with an "Update now" button.
          releaseDraft: false
          prerelease: false

      - name: Publish the download under a fixed name (Todojam.dmg)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg Todojam.dmg
          gh release upload latest-mac Todojam.dmg --clobber
